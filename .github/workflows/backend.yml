name: Backend verification
on:
  push:
    branches: [backend, work]
    paths: ['backend/**', 'packages/api-contract/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'packages/api-contract/**', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: betchu_ci
          POSTGRES_USER: betchu_ci
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U betchu_ci -d betchu_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      BETCHU_TEST_DB_URL: jdbc:postgresql://localhost:5432/betchu_ci
      BETCHU_TEST_DB_USERNAME: betchu_ci
      BETCHU_TEST_DB_PASSWORD: isolated-ci-only
      BETCHU_REQUIRE_INTEGRATION_TESTS: 'true'
      PUSH_ENABLED: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify formatting, units, PostgreSQL migrations and integration flows
        run: bash gradlew spotlessCheck test integrationTest bootJar --no-daemon --console=plain
      - name: Build the local container image without publishing
        run: docker build --tag betchu-api:verification .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-verification
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 14
