openapi: 3.1.0
info:
  title: BETCHU API
  version: 0.4.0
  description: BETCHU 계정·커플 연결, 배츄 영구 등록과 홈, 작성자 전용 퀘스트 초안 계약
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
paths:
  /system/health:
    get:
      operationId: getSystemHealth
      summary: 백엔드 기본 상태 확인
      tags: [ system ]
      security: []
      responses:
        "200":
          description: Backend is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealth"
  /monsters/starters:
    get:
      operationId: getStarterCatalog
      summary: 스타팅 배츄 네 종류와 공통 시작 능력치 조회
      tags: [ monsters ]
      security: []
      responses:
        "200":
          description: Public starter catalog; no personal data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarterCatalog"
  /monsters/starter-preview:
    post:
      operationId: previewStarter
      summary: 종류와 이름을 검증하고 알의 시작 상태 미리보기
      description: >
        상태를 변경하지 않는 공개 미리보기입니다. 계정, 배츄, 지갑 또는 코인을 생성하지 않으며 Idempotency-Key를 요구하지 않습니다. 실제 스타팅 선택은 가입 활성화와 커플
        연결 이후 별도 API로 구현합니다.
      tags: [ monsters ]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StarterPreviewRequest"
            example:
              species: STARLIGHT
              name: 반짝이
      responses:
        "200":
          description: Validated preview only; nothing is persisted or awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarterPreview"
        "400":
          description: Invalid species, name, or JSON request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/StarterSelectionProblem"
  /auth/providers:
    get:
      operationId: getAuthProviders
      security: []
      responses:
        "200":
          description: Configured login providers and registration readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - onboarding
  /auth/login/start:
    post:
      operationId: startLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginStartRequest"
      responses:
        "200":
          description: One-use attempt; retain loginSecret locally and open authorizationUrl
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginStart"
        "400":
          $ref: "#/components/responses/AuthBadRequest"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - onboarding
  /auth/oauth/google/callback:
    get:
      operationId: googleOAuthCallback
      security: []
      description: Server-only Google OAuth redirect. The allowlisted app receives loginId and status SUCCESS or
        FAILED. Only SUCCESS also carries a one-use handoffCode valid for at most 120 seconds. No access
        token, refresh token, or loginSecret is redirected. The app removes callback credentials from the URL
        immediately and supplies both local loginSecret and callback handoffCode to complete login.
      parameters:
        - in: query
          name: state
          required: true
          schema:
            type: string
        - in: query
          name: code
          schema:
            type: string
        - in: query
          name: error
          schema:
            type: string
      responses:
        "302":
          description: Return to the allowlisted app callback
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/AuthBadRequest"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - onboarding
  /auth/login:
    post:
      operationId: completeLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Atomically verify both the local loginSecret and callback-only handoffCode, consume a verified
            attempt, and issue revocable tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          $ref: "#/components/responses/AuthBadRequest"
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        "409":
          $ref: "#/components/responses/AuthConflict"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - onboarding
  /auth/refresh:
    post:
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Rotate the refresh token; the previous refresh token becomes unusable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          $ref: "#/components/responses/AuthBadRequest"
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - onboarding
  /auth/logout:
    post:
      operationId: logoutSession
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Current session revoked immediately
          including its access and refresh tokens: null
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - onboarding
  /users/me:
    get:
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current account and current policy consent status; available to limited onboarding sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMe"
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - onboarding
  /policy-versions/current:
    get:
      operationId: getCurrentPolicyVersions
      security: []
      parameters:
        - in: query
          name: locale
          schema:
            type: string
            default: ko-KR
            enum:
              - ko-KR
      responses:
        "200":
          description: Ready only when current effective approved TERMS and PRIVACY documents exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentPolicies"
        "400":
          $ref: "#/components/responses/AuthBadRequest"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - onboarding
  /onboarding/age-eligibility:
    post:
      operationId: confirmAgeEligibility
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgeEligibilityRequest"
      responses:
        "200":
          description: Age confirmed; account activates only if all current required policies are accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMe"
        "204":
          description: Age rejected or declined; pending user and every limited session deleted immediately
        "400":
          $ref: "#/components/responses/AuthBadRequest"
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        "409":
          $ref: "#/components/responses/AuthConflict"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - onboarding
  /consents/{policyType}:
    put:
      operationId: acceptPolicy
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: policyType
          required: true
          schema:
            $ref: "#/components/schemas/PolicyType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
      responses:
        "200":
          description: Idempotent acceptance of the current effective policy version; may activate the account and grant
            signup coins once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMe"
        "400":
          $ref: "#/components/responses/AuthBadRequest"
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        "409":
          $ref: "#/components/responses/AuthConflict"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - onboarding
  /couples/me:
    get:
      operationId: getMyCouple
      responses:
        "200":
          description: Current accessible relationship and pending invitation; both null when unconnected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoupleState"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - couples
  /couples/invites:
    post:
      operationId: createCoupleInvite
      parameters:
        - $ref: "#/components/parameters/CoupleIdempotencyKey"
      description: A fresh key rotates the existing invitation. A repeated key returns the original metadata with
        code null, even after expiry or rotation; the raw code is never stored or shown again.
      responses:
        "200":
          description: New invitation or idempotent metadata replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedCoupleInvite"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - couples
  /couples/invites/{inviteId}:
    delete:
      operationId: revokeCoupleInvite
      parameters:
        - $ref: "#/components/parameters/CoupleInviteId"
      responses:
        "204":
          description: Revoked; repeat revocation is safe.
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - couples
  /couples/invites/preview:
    post:
      operationId: previewCoupleInvite
      requestBody:
        $ref: "#/components/requestBodies/CoupleCode"
      responses:
        "200":
          description: Only the inviter nickname/profile image; no wallet or other private data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoupleInvitePreview"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - couples
  /couples/join:
    post:
      operationId: joinCoupleInvite
      requestBody:
        $ref: "#/components/requestBodies/CoupleCode"
      responses:
        "200":
          description: Reserves this user as the invitee; does not connect until both users confirm. Repeating this
            claim returns the same pending state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingCoupleInvite"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - couples
  /couples/pending/{inviteId}/confirm:
    post:
      operationId: confirmCoupleInvite
      parameters:
        - $ref: "#/components/parameters/CoupleInviteId"
      responses:
        "200":
          description: This user's confirmation or an idempotent replay; the second confirmation connects atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoupleState"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - couples
  /couples/pending/{inviteId}/reject:
    post:
      operationId: rejectCoupleInvite
      parameters:
        - $ref: "#/components/parameters/CoupleInviteId"
      responses:
        "204":
          description: Rejected and both slots released; repeats are safe.
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - couples
  /couples/me/end:
    post:
      operationId: endMyCouple
      parameters:
        - $ref: "#/components/parameters/CoupleIdempotencyKey"
      responses:
        "200":
          description: Unilateral immediate relationship end. Current increment has no quest/resources to settle.
            Replays never end a later relationship.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoupleEndResult"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - couples
  /couples/me/block:
    post:
      operationId: blockMyPartner
      parameters:
        - $ref: "#/components/parameters/CoupleIdempotencyKey"
      responses:
        "200":
          description: Immediately ends and blocks the current partner; no arbitrary target ID. Replays never block a
            later partner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoupleEndResult"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - couples
  /monsters/starter:
    post:
      operationId: createStarterMonster
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GameIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StarterPreviewRequest"
      responses:
        "201":
          description: Starter created atomically; an identical idempotent retry returns the original response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonsterView"
        "400":
          $ref: "#/components/responses/GameBadRequest"
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        "403":
          $ref: "#/components/responses/GameForbidden"
        "409":
          $ref: "#/components/responses/GameConflict"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - game
  /monsters/me:
    get:
      operationId: getMyMonster
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Personal monster, retained after ending a relationship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonsterResult"
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        "403":
          $ref: "#/components/responses/GameForbidden"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - game
  /monsters/partner:
    get:
      operationId: getPartnerMonster
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current connected partner's monster, or null before their selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonsterResult"
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        "403":
          $ref: "#/components/responses/GameForbidden"
        "409":
          $ref: "#/components/responses/GameConflict"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - game
  /monsters/me/name:
    patch:
      operationId: renameMyMonster
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  type: string
                  description: Uses the same NFC and Unicode name rules as starter preview
      responses:
        "200":
          description: Personal monster renamed without charging coins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonsterView"
        "400":
          $ref: "#/components/responses/GameBadRequest"
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        "403":
          $ref: "#/components/responses/GameForbidden"
        "404":
          $ref: "#/components/responses/GameNotFound"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - game
  /home:
    get:
      operationId: getHome
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Personal wallet and monster, current partner public monster, and privacy-safe quest counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameHome"
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        "403":
          $ref: "#/components/responses/GameForbidden"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - game
  /quests:
    post:
      operationId: createQuestDraft
      parameters:
        - $ref: "#/components/parameters/QuestIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestDraftInput"
      responses:
        "201":
          description: Created draft; same-key replay returns the original response without changing the draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestDraft"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - quests
    get:
      operationId: listQuestDrafts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - DRAFT
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: Only this user's drafts in the current relationship, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestDraftPage"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - quests
  /quests/{questId}:
    parameters:
      - $ref: "#/components/parameters/QuestId"
    get:
      operationId: getQuestDraft
      responses:
        "200":
          description: The author's current draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestDraft"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - quests
  /quests/{questId}/draft:
    parameters:
      - $ref: "#/components/parameters/QuestId"
    patch:
      operationId: updateQuestDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/QuestDraftInputFields"
                - type: object
                  required:
                    - expectedRowVersion
                  properties:
                    expectedRowVersion:
                      type: integer
                      format: int64
                      minimum: 0
              unevaluatedProperties: false
      responses:
        "200":
          description: Updated draft with a new rowVersion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestDraft"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - quests
    delete:
      operationId: discardQuestDraft
      parameters:
        - $ref: "#/components/parameters/QuestIdempotencyKey"
        - name: expectedRowVersion
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: Draft text and retained create-response text are deleted; repeated key returns the original result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestDiscardResult"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - quests
  /couples/me/end-status:
    get:
      operationId: getRelationshipEndStatus
      description: Available to an authenticated ACTIVE user even when policy reconsent is required. No partner data.
      responses:
        "200":
          description: The latest relationship cleanup job for this user.
          content:
            application/json:
              schema:
                type: object
                required:
                  - job
                additionalProperties: false
                properties:
                  job:
                    oneOf:
                      - $ref: "#/components/schemas/RelationshipEndJob"
                      - type: "null"
        default:
          description: Request rejected with a stable BETCHU error code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      tags:
        - couples
components:
  schemas:
    SystemHealth:
      type: object
      additionalProperties: false
      required: [ status, service ]
      properties:
        status:
          type: string
          const: UP
        service:
          type: string
          const: betchu-backend
    StarterSpecies:
      type: string
      enum: [ STARLIGHT, WAVE, SUNSET, FOREST ]
    Starter:
      type: object
      additionalProperties: false
      required: [ species, displayName, description ]
      properties:
        species:
          $ref: "#/components/schemas/StarterSpecies"
        displayName:
          type: string
        description:
          type: string
    InitialStats:
      type: object
      additionalProperties: false
      required: [ level, hp, atk, power, exp, nextLevelRequiredExp ]
      properties:
        level:
          type: integer
          const: 1
        hp:
          type: integer
          const: 100
        atk:
          type: integer
          const: 10
        power:
          type: integer
          const: 700
        exp:
          type: integer
          const: 0
        nextLevelRequiredExp:
          type: integer
          const: 80
    NameRules:
      type: object
      additionalProperties: false
      required: [ minLength, maxLength ]
      properties:
        minLength:
          type: integer
          const: 1
        maxLength:
          type: integer
          const: 10
    GrowthMilestone:
      type: object
      additionalProperties: false
      required: [ type, requiredSuccessCount, description ]
      properties:
        type:
          type: string
          enum: [ HATCH, INTERMEDIATE, FINAL, MASTERY, SUCCESS_80 ]
        requiredSuccessCount:
          type: integer
          enum: [ 1, 20, 40, 60, 80 ]
          description: >
            일반 개인 퀘스트 인정 성공 수 기준입니다. HATCH는 튜토리얼 성공으로도 가능하며 이 경우 인정 성공 수는 0을 유지합니다. 80회는 MVP 자격 기록이며 새 알 선택은
            P2입니다. 성장은 파트너 최종 승인과 서버 정산 커밋 후 반영됩니다.
        description:
          type: string
    GrowthMilestones:
      type: array
      minItems: 5
      maxItems: 5
      items:
        $ref: "#/components/schemas/GrowthMilestone"
    StarterCatalog:
      type: object
      additionalProperties: false
      required: [ starters, initialStats, nameRules, growthMilestones ]
      properties:
        starters:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/Starter"
        initialStats:
          $ref: "#/components/schemas/InitialStats"
        nameRules:
          $ref: "#/components/schemas/NameRules"
        growthMilestones:
          $ref: "#/components/schemas/GrowthMilestones"
    StarterPreviewRequest:
      type: object
      additionalProperties: false
      required: [ species, name ]
      properties:
        species:
          $ref: "#/components/schemas/StarterSpecies"
        name:
          type: string
          description: >
            NFC 정규화 후 양끝 Unicode White_Space를 제거합니다. 이후 Unicode code point 1~10개여야 하며 Cc/Cf 제어·서식 문자와 내부
            줄바꿈(U+2028, U+2029 포함)은 거절합니다. UTF-16 code unit 수가 아닙니다. 원문을 로그나 오류에 반영하지 않습니다.
    StarterPreview:
      type: object
      additionalProperties: false
      required: [ previewOnly, starter, name, stage, recognizedSuccessCount, stats, growthMilestones ]
      properties:
        previewOnly:
          type: boolean
          const: true
        starter:
          $ref: "#/components/schemas/Starter"
        name:
          type: string
          minLength: 1
          maxLength: 10
          description: NFC normalized, with surrounding Unicode White_Space removed
        stage:
          type: string
          const: EGG
        recognizedSuccessCount:
          type: integer
          const: 0
        stats:
          $ref: "#/components/schemas/InitialStats"
        growthMilestones:
          $ref: "#/components/schemas/GrowthMilestones"
    StarterSelectionProblem:
      type: object
      required: [ type, title, status, detail, errorCode ]
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
        status:
          type: integer
          const: 400
        detail:
          type: string
        errorCode:
          type: string
          const: INVALID_STARTER_SELECTION
    ApiProblem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - errorCode
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errorCode:
          type: string
    AuthProviders:
      type: object
      required:
        - providers
        - registrationAvailable
      properties:
        providers:
          type: array
          items:
            type: object
            required:
              - provider
              - displayName
              - enabled
            properties:
              provider:
                type: string
                const: GOOGLE
              displayName:
                type: string
              enabled:
                type: boolean
        registrationAvailable:
          type: boolean
    LoginStartRequest:
      type: object
      additionalProperties: false
      required:
        - provider
        - redirectUri
      properties:
        provider:
          type: string
          const: GOOGLE
        redirectUri:
          type: string
          maxLength: 1000
    LoginStart:
      type: object
      required:
        - loginId
        - loginSecret
        - authorizationUrl
        - expiresAt
      properties:
        loginId:
          type: string
          format: uuid
        loginSecret:
          type: string
        authorizationUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - loginId
        - loginSecret
        - handoffCode
      properties:
        loginId:
          type: string
          format: uuid
        loginSecret:
          type: string
          minLength: 1
          maxLength: 128
        handoffCode:
          type: string
          minLength: 1
          maxLength: 128
          description: One-use callback proof; valid for at most 120 seconds and stored only as a hash on the server
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 128
    AuthTokens:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          const: 300
        user:
          $ref: "#/components/schemas/UserMe"
    UserMe:
      type: object
      required:
        - id
        - nickname
        - status
        - ageEligible
        - requiredPolicyVersionIds
        - missingPolicyVersionIds
        - evidenceConsent
        - availableCoins
        - lockedCoins
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
          minLength: 1
          maxLength: 30
        status:
          type: string
          enum:
            - PENDING_ELIGIBILITY
            - ACTIVE
            - DELETION_PENDING
            - DELETED
        ageEligible:
          type: boolean
        requiredPolicyVersionIds:
          type: array
          items:
            type: string
            format: uuid
        missingPolicyVersionIds:
          type: array
          items:
            type: string
            format: uuid
        evidenceConsent:
          type: boolean
        availableCoins:
          type:
            - integer
            - "null"
          minimum: 0
        lockedCoins:
          type:
            - integer
            - "null"
          minimum: 0
    PolicyType:
      type: string
      enum:
        - TERMS
        - PRIVACY
        - EVIDENCE_OPTIONAL
    PolicyVersion:
      type: object
      required:
        - id
        - policyType
        - version
        - locale
        - required
        - documentUrl
        - effectiveAt
      properties:
        id:
          type: string
          format: uuid
        policyType:
          $ref: "#/components/schemas/PolicyType"
        version:
          type: string
        locale:
          type: string
          const: ko-KR
        required:
          type: boolean
        documentUrl:
          type: string
          format: uri
        effectiveAt:
          type: string
          format: date-time
    CurrentPolicies:
      type: object
      required:
        - ready
        - policies
      properties:
        ready:
          type: boolean
        policies:
          type: array
          items:
            $ref: "#/components/schemas/PolicyVersion"
    AgeEligibilityRequest:
      type: object
      additionalProperties: false
      required:
        - eligible
      properties:
        eligible:
          type:
            - boolean
            - "null"
    ConsentRequest:
      type: object
      additionalProperties: false
      required:
        - policyVersionId
        - locale
      properties:
        policyVersionId:
          type: string
          format: uuid
        locale:
          type: string
          const: ko-KR
    CouplePublicProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - nickname
        - profileImage
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        profileImage:
          type:
            - string
            - "null"
    CurrentCouple:
      type: object
      additionalProperties: false
      required:
        - id
        - connectedAt
        - partner
      properties:
        id:
          type: string
          format: uuid
        connectedAt:
          type: string
          format: date-time
        partner:
          $ref: "#/components/schemas/CouplePublicProfile"
    PendingCoupleInvite:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - role
        - expiresAt
        - partner
        - myConfirmed
        - partnerConfirmed
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - ACTIVE
            - PENDING_CONFIRMATION
        role:
          type: string
          enum:
            - INVITER
            - INVITEE
        expiresAt:
          type: string
          format: date-time
        partner:
          oneOf:
            - $ref: "#/components/schemas/CouplePublicProfile"
            - type: "null"
        myConfirmed:
          type: boolean
        partnerConfirmed:
          type: boolean
    CoupleState:
      type: object
      additionalProperties: false
      required:
        - couple
        - pendingInvite
      properties:
        couple:
          oneOf:
            - $ref: "#/components/schemas/CurrentCouple"
            - type: "null"
        pendingInvite:
          oneOf:
            - $ref: "#/components/schemas/PendingCoupleInvite"
            - type: "null"
    CreatedCoupleInvite:
      type: object
      additionalProperties: false
      required:
        - inviteId
        - code
        - expiresAt
      properties:
        inviteId:
          type: string
          format: uuid
        code:
          type:
            - string
            - "null"
          description: 16 random characters in four hyphen-separated groups; null on replay.
        expiresAt:
          type: string
          format: date-time
    CoupleInvitePreview:
      type: object
      additionalProperties: false
      required:
        - inviteId
        - inviter
        - expiresAt
      properties:
        inviteId:
          type: string
          format: uuid
        inviter:
          $ref: "#/components/schemas/CouplePublicProfile"
        expiresAt:
          type: string
          format: date-time
    CoupleEndResult:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - PROCESSING
            - COMPLETED
    MonsterGrowthMilestone:
      type: string
      enum:
        - HATCH
        - SUCCESS_20
        - SUCCESS_40
        - SUCCESS_60
        - SUCCESS_80
    MonsterView:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - species
        - growthStage
        - recognizedSuccessCount
        - nextGrowthMilestone
        - reachedMilestones
        - masteryRewards
        - accountLevel
        - currentLevelExp
        - nextLevelRequiredExp
        - baseHp
        - baseAttack
        - equipmentBonusHp
        - equipmentBonusAttack
        - finalHp
        - finalAttack
        - combatPower
        - streak
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 10
        species:
          $ref: "#/components/schemas/StarterSpecies"
        growthStage:
          type: string
          enum:
            - EGG
            - BABY
            - INTERMEDIATE
            - FINAL
        recognizedSuccessCount:
          type: integer
          minimum: 0
        nextGrowthMilestone:
          anyOf:
            - $ref: "#/components/schemas/MonsterGrowthMilestone"
            - type: "null"
        reachedMilestones:
          type: array
          items:
            $ref: "#/components/schemas/MonsterGrowthMilestone"
        masteryRewards:
          type: array
          maxItems: 0
          items:
            type: string
          description: Empty until mastery rewards are implemented
        accountLevel:
          type: integer
          minimum: 1
          maximum: 50
        currentLevelExp:
          type: integer
          minimum: 0
        nextLevelRequiredExp:
          type:
            - integer
            - "null"
          minimum: 0
        baseHp:
          type: integer
          minimum: 1
        baseAttack:
          type: integer
          minimum: 1
        equipmentBonusHp:
          type: integer
          const: 0
        equipmentBonusAttack:
          type: integer
          const: 0
        finalHp:
          type: integer
          minimum: 1
        finalAttack:
          type: integer
          minimum: 1
        combatPower:
          type: integer
          minimum: 1
        streak:
          type: integer
          minimum: 0
    MonsterResult:
      type: object
      additionalProperties: false
      required:
        - monster
      properties:
        monster:
          anyOf:
            - $ref: "#/components/schemas/MonsterView"
            - type: "null"
    GameHome:
      type: object
      additionalProperties: false
      required:
        - serverTime
        - coupleId
        - self
        - partner
        - ownDraftCount
        - questStatusSummary
      properties:
        serverTime:
          type: string
          format: date-time
        coupleId:
          type:
            - string
            - "null"
          format: uuid
        self:
          $ref: "#/components/schemas/GameHomeSelf"
        partner:
          anyOf:
            - $ref: "#/components/schemas/GameHomePartner"
            - type: "null"
        ownDraftCount:
          type: integer
          minimum: 0
        questStatusSummary:
          $ref: "#/components/schemas/QuestStatusSummary"
    GameHomeSelf:
      type: object
      additionalProperties: false
      required:
        - id
        - nickname
        - availableCoins
        - lockedCoins
        - monster
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        availableCoins:
          type: integer
          minimum: 0
        lockedCoins:
          type: integer
          minimum: 0
        monster:
          anyOf:
            - $ref: "#/components/schemas/MonsterView"
            - type: "null"
    GameHomePartner:
      type: object
      additionalProperties: false
      required:
        - id
        - nickname
        - profileImage
        - monster
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        profileImage:
          type:
            - string
            - "null"
        monster:
          anyOf:
            - $ref: "#/components/schemas/MonsterView"
            - type: "null"
    QuestStatusSummary:
      type: object
      additionalProperties: false
      required:
        - pendingApproval
        - active
        - awaitingResult
      properties:
        pendingApproval:
          type: integer
          minimum: 0
        active:
          type: integer
          minimum: 0
        awaitingResult:
          type: integer
          minimum: 0
          description: AWAITING_RESULT plus PENDING_FINAL_APPROVAL
    QuestDraftInputFields:
      type: object
      required:
        - title
        - category
        - successCriteria
        - difficulty
        - stake
        - dueAt
        - resultAt
        - minimumDurationMinutes
        - evidenceMethod
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
          description: NFC and Unicode White_Space edge trim; 1-80 code points; no Cc, Cf or line breaks.
        category:
          type: string
          enum:
            - SLEEP
            - EXERCISE
            - STUDY
            - CONTACT
            - GAMING
            - SPENDING
            - HOUSEWORK
            - EATING
            - DATE
            - CUSTOM
        successCriteria:
          type: string
          minLength: 1
          maxLength: 1000
          description: NFC and Unicode White_Space edge trim; 1-1000 code points; internal LF allowed, other
            control/format/line-separator characters rejected.
        difficulty:
          type: integer
          minimum: 1
          maximum: 4
        stake:
          type: integer
          enum:
            - 0
            - 100
        dueAt:
          type: string
          format: date-time
          description: Offset required, 2000-01-01T00:00:00Z inclusive to 2101-01-01T00:00:00Z exclusive. Server
            truncates to UTC microseconds before comparisons, hashing and storage. Past dates may be saved.
        resultAt:
          type: string
          format: date-time
          description: Offset required, same date range as dueAt and strictly later than dueAt after truncation to UTC
            microseconds.
        minimumDurationMinutes:
          type: integer
          minimum: 0
          maximum: 10080
        evidenceMethod:
          type: string
          enum:
            - NONE
    QuestDraftInput:
      allOf:
        - $ref: "#/components/schemas/QuestDraftInputFields"
      unevaluatedProperties: false
    QuestDraft:
      allOf:
        - $ref: "#/components/schemas/QuestDraftInputFields"
        - type: object
          required:
            - id
            - coupleId
            - status
            - questType
            - sourceType
            - rowVersion
            - approvalDeadlineAt
            - resultConfirmationDeadlineAt
            - createdAt
            - updatedAt
          properties:
            id:
              type: string
              format: uuid
            coupleId:
              type: string
              format: uuid
            status:
              type: string
              enum:
                - DRAFT
            questType:
              type: string
              enum:
                - PERSONAL
            sourceType:
              type: string
              enum:
                - CUSTOM
            rowVersion:
              type: integer
              format: int64
              minimum: 0
            approvalDeadlineAt:
              type: string
              format: date-time
            resultConfirmationDeadlineAt:
              type: string
              format: date-time
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
      unevaluatedProperties: false
    QuestDraftPage:
      type: object
      additionalProperties: false
      required:
        - quests
        - nextCursor
      properties:
        quests:
          type: array
          items:
            $ref: "#/components/schemas/QuestDraft"
        nextCursor:
          type:
            - string
            - "null"
    QuestDiscardResult:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - rowVersion
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - DISCARDED
        rowVersion:
          type: integer
          format: int64
          minimum: 1
    RelationshipEndJob:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - targetResourceCount
        - processedResourceCount
        - createdAt
        - completedAt
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PROCESSING
            - COMPLETED
        targetResourceCount:
          type: integer
          minimum: 0
          description: Only resources authored by the caller; excludes all private partner drafts.
        processedResourceCount:
          type: integer
          minimum: 0
          description: Completed resources authored by the caller. Status still describes completion of the whole job.
        createdAt:
          type: string
          format: date-time
        completedAt:
          type:
            - string
            - "null"
          format: date-time
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    AuthBadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    AuthUnauthorized:
      description: Invalid, expired, consumed or revoked credentials
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    AuthConflict:
      description: Login pending, obsolete policy version, or account state conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    AuthUnavailable:
      description: Required external authentication settings are unavailable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    GameBadRequest:
      description: Invalid JSON, monster name, starter species, or idempotency key
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    GameForbidden:
      description: Account activation or current required policy consent is incomplete
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    GameConflict:
      description: COUPLE_REQUIRED, STARTER_ALREADY_EXISTS, or IDEMPOTENCY_KEY_REUSED
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    GameNotFound:
      description: Personal active monster does not exist
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
  parameters:
    CoupleIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CoupleInviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GameIdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        format: uuid
    QuestId:
      name: questId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  requestBodies:
    CoupleCode:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - code
            properties:
              code:
                type: string
                maxLength: 64
security:
  - BearerAuth: []
