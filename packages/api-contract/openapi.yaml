        lowBonusRemaining:
          type: integer
          minimum: 0
          maximum: 100
        expectedReward:
          type: integer
          enum:
            - 0
            - 25
            - 50
        allowedStakes:
          type: array
          items:
            type: integer
            enum:
              - 0
              - 100
        canApprove:
          type: boolean
        blockingReason:
          anyOf:
            - type: string
            - type: "null"
    PersonalQuestActivitySummary:
      type: object
      additionalProperties: false
      required:
        - weekStartAt
        - weekEndAt
        - current
        - target
        - unlocked
      properties:
        weekStartAt: &a7
          type: string
          format: date-time
        weekEndAt: *a7
        current:
          type: integer
          minimum: 0
        target:
          type: integer
          const: 10
        unlocked:
          type: boolean
    PersonalQuestBettingRules:
      type: object
      additionalProperties: false
      required:
        - coupleId
        - suspended
        - generation
        - suspendedAt
        - acknowledgedAt
        - partnerAcknowledged
        - serverTime
      properties:
        coupleId:
          type: string
          format: uuid
        suspended:
          type: boolean
        generation:
          type: integer
          minimum: 0
        suspendedAt:
          anyOf:
            - &a8
              type: string
              format: date-time
            - type: "null"
        acknowledgedAt:
          anyOf:
            - *a8
            - type: "null"
        partnerAcknowledged:
          type: boolean
        serverTime: *a8
    PersonalQuestRowRequest:
      type: object
      additionalProperties: false
      required:
        - expectedRowVersion
      properties:
        expectedRowVersion:
          type: integer
          minimum: 0
    PersonalQuestVersionRequest:
      type: object
      additionalProperties: false
      required:
        - questVersionId
        - expectedRowVersion
      properties:
        questVersionId:
          type: string
          format: uuid
        expectedRowVersion:
          type: integer
          minimum: 0
    PersonalQuestChangeRequest:
      type: object
      additionalProperties: false
      required:
        - questVersionId
        - expectedRowVersion
        - requestMessage
      properties:
        questVersionId:
          type: string
          format: uuid
        expectedRowVersion:
          type: integer
          minimum: 0
        requestMessage:
          type: string
          minLength: 1
          maxLength: 1000
    PersonalQuestApproveRequest:
      type: object
      additionalProperties: false
      required:
        - questVersionId
        - expectedRowVersion
        - predictedResult
      properties:
        questVersionId:
          type: string
          format: uuid
        expectedRowVersion:
          type: integer
          minimum: 0
        predictedResult:
          type: string
          enum:
            - SUCCESS
            - FAILURE
    PersonalQuestResultRequest:
      type: object
      additionalProperties: false
      required:
        - expectedRowVersion
        - selectedResult
      properties:
        expectedRowVersion:
          type: integer
          minimum: 0
        selectedResult:
          type: string
          enum:
            - SUCCESS
            - FAILURE
    PersonalQuestFinalRequest:
      type: object
      additionalProperties: false
      required:
        - expectedRowVersion
        - selectedResult
        - selectionRevision
      properties:
        expectedRowVersion:
          type: integer
          minimum: 0
        selectedResult:
          type: string
          enum:
            - SUCCESS
            - FAILURE
        selectionRevision:
          type: integer
          minimum: 1
    PersonalQuestAcknowledgeRequest:
      type: object
      additionalProperties: false
      required:
        - expectedGeneration
      properties:
        expectedGeneration:
          type: integer
          minimum: 0
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    AuthBadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    AuthUnauthorized:
      description: Invalid, expired, consumed or revoked credentials
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    AuthConflict:
      description: Login pending, obsolete policy version, or account state conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    AuthUnavailable:
      description: Required external authentication settings are unavailable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    GameBadRequest:
      description: Invalid JSON, monster name, starter species, or idempotency key
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    GameForbidden:
      description: Account activation or current required policy consent is incomplete
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    GameConflict:
      description: COUPLE_REQUIRED, STARTER_ALREADY_EXISTS, or IDEMPOTENCY_KEY_REUSED
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    GameNotFound:
      description: Personal active monster does not exist
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
  parameters:
    CoupleIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CoupleInviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GameIdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        format: uuid
    QuestId:
      name: questId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  requestBodies:
    CoupleCode:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - code
            properties:
              code:
                type: string
                maxLength: 64
security:
  - BearerAuth: []
