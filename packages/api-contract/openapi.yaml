openapi: 3.1.0
info:
  title: BETCHU API
  version: 0.2.0
  description: 스타팅 배츄 미리보기 계약. 계정 활성화와 배츄 생성은 포함하지 않습니다.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
paths:
  /system/health:
    get:
      operationId: getSystemHealth
      summary: 백엔드 기본 상태 확인
      tags: [system]
      security: []
      responses:
        "200":
          description: Backend is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealth"
  /monsters/starters:
    get:
      operationId: getStarterCatalog
      summary: 스타팅 배츄 네 종류와 공통 시작 능력치 조회
      tags: [monsters]
      security: []
      responses:
        "200":
          description: Public starter catalog; no personal data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarterCatalog"
  /monsters/starter-preview:
    post:
      operationId: previewStarter
      summary: 종류와 이름을 검증하고 알의 시작 상태 미리보기
      description: >
        상태를 변경하지 않는 공개 미리보기입니다. 계정, 배츄, 지갑 또는 코인을
        생성하지 않으며 Idempotency-Key를 요구하지 않습니다.
        실제 스타팅 선택은 가입 활성화와 커플 연결 이후 별도 API로 구현합니다.
      tags: [monsters]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StarterPreviewRequest"
            example:
              species: STARLIGHT
              name: 반짝이
      responses:
        "200":
          description: Validated preview only; nothing is persisted or awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarterPreview"
        "400":
          description: Invalid species, name, or JSON request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/StarterSelectionProblem"
components:
  schemas:
    SystemHealth:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          const: UP
        service:
          type: string
          const: betchu-backend
    StarterSpecies:
      type: string
      enum: [STARLIGHT, WAVE, SUNSET, FOREST]
    Starter:
      type: object
      additionalProperties: false
      required: [species, displayName, description]
      properties:
        species:
          $ref: "#/components/schemas/StarterSpecies"
        displayName:
          type: string
        description:
          type: string
    InitialStats:
      type: object
      additionalProperties: false
      required: [level, hp, atk, power, exp, nextLevelRequiredExp]
      properties:
        level:
          type: integer
          const: 1
        hp:
          type: integer
          const: 100
        atk:
          type: integer
          const: 10
        power:
          type: integer
          const: 700
        exp:
          type: integer
          const: 0
        nextLevelRequiredExp:
          type: integer
          const: 80
    NameRules:
      type: object
      additionalProperties: false
      required: [minLength, maxLength]
      properties:
        minLength:
          type: integer
          const: 1
        maxLength:
          type: integer
          const: 10
    GrowthMilestone:
      type: object
      additionalProperties: false
      required: [type, requiredSuccessCount, description]
      properties:
        type:
          type: string
          enum: [HATCH, INTERMEDIATE, FINAL, MASTERY, SUCCESS_80]
        requiredSuccessCount:
          type: integer
          enum: [1, 20, 40, 60, 80]
          description: >
            일반 개인 퀘스트 인정 성공 수 기준입니다. HATCH는 튜토리얼 성공으로도
            가능하며 이 경우 인정 성공 수는 0을 유지합니다. 80회는 MVP 자격 기록이며
            새 알 선택은 P2입니다. 성장은 파트너 최종 승인과 서버 정산 커밋 후 반영됩니다.
        description:
          type: string
    GrowthMilestones:
      type: array
      minItems: 5
      maxItems: 5
      items:
        $ref: "#/components/schemas/GrowthMilestone"
    StarterCatalog:
      type: object
      additionalProperties: false
      required: [starters, initialStats, nameRules, growthMilestones]
      properties:
        starters:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/Starter"
        initialStats:
          $ref: "#/components/schemas/InitialStats"
        nameRules:
          $ref: "#/components/schemas/NameRules"
        growthMilestones:
          $ref: "#/components/schemas/GrowthMilestones"
    StarterPreviewRequest:
      type: object
      additionalProperties: false
      required: [species, name]
      properties:
        species:
          $ref: "#/components/schemas/StarterSpecies"
        name:
          type: string
          description: >
            NFC 정규화 후 양끝 Unicode White_Space를 제거합니다. 이후 Unicode code point
            1~10개여야 하며 Cc/Cf 제어·서식 문자와 내부 줄바꿈(U+2028, U+2029 포함)은
            거절합니다. UTF-16 code unit 수가 아닙니다. 원문을 로그나 오류에 반영하지 않습니다.
    StarterPreview:
      type: object
      additionalProperties: false
      required: [previewOnly, starter, name, stage, recognizedSuccessCount, stats, growthMilestones]
      properties:
        previewOnly:
          type: boolean
          const: true
        starter:
          $ref: "#/components/schemas/Starter"
        name:
          type: string
          minLength: 1
          maxLength: 10
          description: NFC normalized, with surrounding Unicode White_Space removed
        stage:
          type: string
          const: EGG
        recognizedSuccessCount:
          type: integer
          const: 0
        stats:
          $ref: "#/components/schemas/InitialStats"
        growthMilestones:
          $ref: "#/components/schemas/GrowthMilestones"
    StarterSelectionProblem:
      type: object
      required: [type, title, status, detail, errorCode]
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
        status:
          type: integer
          const: 400
        detail:
          type: string
        errorCode:
          type: string
          const: INVALID_STARTER_SELECTION
