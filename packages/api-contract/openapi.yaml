components:
  schemas:
    SystemHealth:
      type: object
      additionalProperties: false
      required: [ status, service ]
      properties:
        status:
          type: string
          const: UP
        service:
          type: string
          const: betchu-backend
    StarterSpecies:
      type: string
      enum: [ STARLIGHT, WAVE, SUNSET, FOREST ]
    Starter:
      type: object
      additionalProperties: false
      required: [ species, displayName, description ]
      properties:
        species:
          $ref: "#/components/schemas/StarterSpecies"
        displayName:
          type: string
        description:
          type: string
    InitialStats:
      type: object
      additionalProperties: false
      required: [ level, hp, atk, power, exp, nextLevelRequiredExp ]
      properties:
        level:
          type: integer
          const: 1
        hp:
          type: integer
          const: 100
        atk:
          type: integer
          const: 10
        power:
          type: integer
          const: 700
        exp:
          type: integer
          const: 0
        nextLevelRequiredExp:
          type: integer
          const: 80
    NameRules:
      type: object
      additionalProperties: false
      required: [ minLength, maxLength ]
      properties:
        minLength:
          type: integer
          const: 1
        maxLength:
          type: integer
          const: 10
    GrowthMilestone:
      type: object
      additionalProperties: false
      required: [ type, requiredSuccessCount, description ]
      properties:
        type:
          type: string
          enum: [ HATCH, INTERMEDIATE, FINAL, MASTERY, SUCCESS_80 ]
        requiredSuccessCount:
          type: integer
          enum: [ 1, 20, 40, 60, 80 ]
          description: >
            일반 개인 퀘스트 인정 성공 수 기준입니다. HATCH는 튜토리얼 성공으로도 가능하며 이 경우 인정 성공 수는 0을 유지합니다. 80회는 MVP 자격 기록이며 새 알 선택은
            P2입니다. 성장은 파트너 최종 승인과 서버 정산 커밋 후 반영됩니다.
        description:
          type: string
    GrowthMilestones:
      type: array
      minItems: 5
      maxItems: 5
      items:
        $ref: "#/components/schemas/GrowthMilestone"
    StarterCatalog:
      type: object
      additionalProperties: false
      required: [ starters, initialStats, nameRules, growthMilestones ]
      properties:
        starters:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/Starter"
        initialStats:
          $ref: "#/components/schemas/InitialStats"
        nameRules:
          $ref: "#/components/schemas/NameRules"
        growthMilestones:
          $ref: "#/components/schemas/GrowthMilestones"
    StarterPreviewRequest:
      type: object
      additionalProperties: false
      required: [ species, name ]
      properties:
        species:
          $ref: "#/components/schemas/StarterSpecies"
        name:
          type: string
          description: >
            NFC 정규화 후 양끝 Unicode White_Space를 제거합니다. 이후 Unicode code point 1~10개여야 하며 Cc/Cf 제어·서식 문자와 내부
            줄바꿈(U+2028, U+2029 포함)은 거절합니다. UTF-16 code unit 수가 아닙니다. 원문을 로그나 오류에 반영하지 않습니다.
    StarterPreview:
      type: object
      additionalProperties: false
      required: [ previewOnly, starter, name, stage, recognizedSuccessCount, stats, growthMilestones ]
      properties:
        previewOnly:
          type: boolean
          const: true
        starter:
          $ref: "#/components/schemas/Starter"
        name:
          type: string
          minLength: 1
          maxLength: 10
          description: NFC normalized, with surrounding Unicode White_Space removed
        stage:
          type: string
          const: EGG
        recognizedSuccessCount:
          type: integer
          const: 0
        stats:
          $ref: "#/components/schemas/InitialStats"
        growthMilestones:
          $ref: "#/components/schemas/GrowthMilestones"
    StarterSelectionProblem:
      type: object
      required: [ type, title, status, detail, errorCode ]
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
        status:
          type: integer
          const: 400
        detail:
          type: string
        errorCode:
          type: string
          const: INVALID_STARTER_SELECTION
    ApiProblem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - errorCode
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errorCode:
          type: string
    AuthProviders:
      type: object
      required:
        - providers
        - registrationAvailable
      properties:
        providers:
          type: array
          items:
            type: object
            required:
              - provider
              - displayName
              - enabled
            properties:
              provider:
                type: string
                const: GOOGLE
              displayName:
                type: string
              enabled:
                type: boolean
        registrationAvailable:
          type: boolean
    LoginStartRequest:
      type: object
      additionalProperties: false
      required:
        - provider
        - redirectUri
      properties:
        provider:
          type: string
          const: GOOGLE
        redirectUri:
          type: string
          maxLength: 1000
    LoginStart:
      type: object
      required:
        - loginId
        - loginSecret
        - authorizationUrl
        - expiresAt
      properties:
        loginId:
          type: string
          format: uuid
        loginSecret:
          type: string
        authorizationUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - loginId
        - loginSecret
        - handoffCode
      properties:
        loginId:
          type: string
          format: uuid
        loginSecret:
          type: string
          minLength: 1
          maxLength: 128
        handoffCode:
          type: string
          minLength: 1
          maxLength: 128
          description: One-use callback proof; valid for at most 120 seconds and stored only as a hash on the server
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 128
    AuthTokens:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          const: 300
        user:
          $ref: "#/components/schemas/UserMe"
    UserMe:
      type: object
      required:
        - id
        - nickname
        - status
        - ageEligible
        - requiredPolicyVersionIds
        - missingPolicyVersionIds
        - evidenceConsent
        - availableCoins
        - lockedCoins
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
          minLength: 1
          maxLength: 30
        status:
          type: string
          enum:
            - PENDING_ELIGIBILITY
            - ACTIVE
            - DELETION_PENDING
            - DELETED
        ageEligible:
          type: boolean
        requiredPolicyVersionIds:
          type: array
          items:
            type: string
            format: uuid
        missingPolicyVersionIds:
          type: array
          items:
            type: string
            format: uuid
        evidenceConsent:
          type: boolean
        availableCoins:
          type:
            - integer
            - "null"
          minimum: 0
        lockedCoins:
          type:
            - integer
            - "null"
          minimum: 0
    PolicyType:
      type: string
      enum:
        - TERMS
        - PRIVACY
        - EVIDENCE_OPTIONAL
    PolicyVersion:
      type: object
      required:
        - id
        - policyType
        - version
        - locale
        - required
        - documentUrl
        - effectiveAt
      properties:
        id:
          type: string
          format: uuid
        policyType:
          $ref: "#/components/schemas/PolicyType"
        version:
          type: string
        locale:
          type: string
          const: ko-KR
        required:
          type: boolean
        documentUrl:
          type: string
          format: uri
        effectiveAt:
          type: string
          format: date-time
    CurrentPolicies:
      type: object
      required:
        - ready
        - policies
      properties:
        ready:
          type: boolean
        policies:
          type: array
          items:
            $ref: "#/components/schemas/PolicyVersion"
    AgeEligibilityRequest:
      type: object
      additionalProperties: false
      required:
        - eligible
      properties:
        eligible:
          type:
            - boolean
            - "null"
    ConsentRequest:
      type: object
      additionalProperties: false
      required:
        - policyVersionId
        - locale
      properties:
        policyVersionId:
          type: string
          format: uuid
        locale:
          type: string
          const: ko-KR
    CouplePublicProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - nickname
        - profileImage
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        profileImage:
          type:
            - string
            - "null"
    CurrentCouple:
      type: object
      additionalProperties: false
      required:
        - id
        - connectedAt
        - partner
      properties:
        id:
          type: string
          format: uuid
        connectedAt:
          type: string
          format: date-time
        partner:
          $ref: "#/components/schemas/CouplePublicProfile"
    PendingCoupleInvite:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - role
        - expiresAt
        - partner
        - myConfirmed
        - partnerConfirmed
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - ACTIVE
            - PENDING_CONFIRMATION
        role:
          type: string
          enum:
            - INVITER
            - INVITEE
        expiresAt:
          type: string
          format: date-time
        partner:
          oneOf:
            - $ref: "#/components/schemas/CouplePublicProfile"
            - type: "null"
        myConfirmed:
          type: boolean
        partnerConfirmed:
          type: boolean
    CoupleState:
      type: object
      additionalProperties: false
      required:
        - couple
        - pendingInvite
      properties:
        couple:
          oneOf:
            - $ref: "#/components/schemas/CurrentCouple"
            - type: "null"
        pendingInvite:
          oneOf:
            - $ref: "#/components/schemas/PendingCoupleInvite"
            - type: "null"
    CreatedCoupleInvite:
      type: object
      additionalProperties: false
      required:
        - inviteId
        - code
        - expiresAt
      properties:
        inviteId:
          type: string
          format: uuid
        code:
          type:
            - string
            - "null"
          description: 16 random characters in four hyphen-separated groups; null on replay.
        expiresAt:
          type: string
          format: date-time
    CoupleInvitePreview:
      type: object
      additionalProperties: false
      required:
        - inviteId
        - inviter
        - expiresAt
      properties:
        inviteId:
          type: string
          format: uuid
        inviter:
          $ref: "#/components/schemas/CouplePublicProfile"
        expiresAt:
          type: string
          format: date-time
    CoupleEndResult:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - PROCESSING
            - COMPLETED
    MonsterGrowthMilestone:
      type: string
      enum:
        - HATCH
        - SUCCESS_20
        - SUCCESS_40
        - SUCCESS_60
        - SUCCESS_80
    MonsterView:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - species
        - growthStage
        - recognizedSuccessCount
        - nextGrowthMilestone
        - reachedMilestones
        - masteryRewards
        - accountLevel
        - currentLevelExp
        - nextLevelRequiredExp
        - baseHp
        - baseAttack
        - equipmentBonusHp
        - equipmentBonusAttack
        - finalHp
        - finalAttack
        - combatPower
        - streak
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 10
        species:
          $ref: "#/components/schemas/StarterSpecies"
        growthStage:
          type: string
          enum:
            - EGG
            - BABY
            - INTERMEDIATE
            - FINAL
        recognizedSuccessCount:
          type: integer
          minimum: 0
        nextGrowthMilestone:
          anyOf:
            - $ref: "#/components/schemas/MonsterGrowthMilestone"
            - type: "null"
        reachedMilestones:
          type: array
          items:
            $ref: "#/components/schemas/MonsterGrowthMilestone"
        masteryRewards:
          type: array
          maxItems: 3
